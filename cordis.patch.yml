# Horon: one Host row owning the console service, the `horon` tool and the
# lifecycle hooks, plus the Client half that adds the sidebar entry, the panel and
# the Settings page section.
#
# Three ways to run the Horon service (see the header of index.js). The settings
# page (Settings → Horon service) writes this same block for you; by hand:
#   - spawn mode (the default below): the plugin starts `root`'s Horon with `python`.
#   - docker mode: the service is the container deployed from the plugin's docker/
#     context. Nothing is spawned; `autostart` only runs `docker start` on an
#     existing container. `root`/`python`/`host`/`port` are ignored.
#       config:
#         mode: docker
#         autostart: true
#         hooks: true
#     Optional (defaults shown; `~` is the home directory of whoever runs dsh):
#         dataDir: '~/.horon/docker'          # holds the three mounts below
#         dbFile: '~/.horon/docker/data/horon.db'   # its directory is mounted at /data
#         envFile: '~/.horon/docker/.env'
#         tagPluginsDir: '~/.horon/docker/tag_plugins'
#         dockerBind: '127.0.0.1'             # the service has no auth: keep it on loopback
#         dockerPort: 8710
#         image: 'horon-service:local'
#         container: 'horon'
#         buildProxy: 'http://host.docker.internal:7890'   # only when the build needs a proxy
#   - url mode: set `url` to a running Horon service elsewhere; nothing is started.
#       config:
#         url: 'http://127.0.0.1:8710'
#         hooks: true
#   Optional in every mode:
#       skills: true        # register horon-cli / horon-circuit / horon-plugin as skills
#                           # (default on outside spawn mode)
- insert:
    - id: dsh-horon
      name: 'dsh-horon'
      config:
        # No root / python here on purpose: a shipped bundle patch is applied on every machine
        # that installs it, so it may only carry values that are true everywhere. Both default to
        # ~/horon and <root>/.venv (or PATH `python`); set them in the profile patch if yours
        # live elsewhere. spawn mode reads them, docker/url modes ignore them.
        port: 8710
        autostart: true
        hooks: true
